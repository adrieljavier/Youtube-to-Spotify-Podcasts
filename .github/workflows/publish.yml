name: Publish sermon episodes

on:
  schedule:
    # Hourly, at :23 past. Off-the-hour times are less contended on the shared
    # GitHub Actions scheduler, so runs start closer to on time.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max episodes to publish this run (blank = config default)"
        required: false
        default: ""
      dry_run:
        description: "Discover and queue only — publish nothing"
        type: boolean
        required: false
        default: false

# Required so the run can commit state.json and docs/feed.xml back to the repo.
permissions:
  contents: write

# Never let two runs process the same queue at once.
concurrency:
  group: publish-sermon-podcast
  cancel-in-progress: false

jobs:
  publish:
    # Runs on a machine you own, NOT GitHub's servers.
    #
    # YouTube blocks GitHub-hosted runners outright — every player client is
    # answered with "Sign in to confirm you're not a bot", because the whole
    # datacenter IP range is blocked. A self-hosted runner on an ordinary
    # internet connection is not. Everything else about this workflow is
    # unchanged: same schedule, same secrets, same manual trigger.
    #
    # See SETUP-RUNNER.md for how to register the machine.
    runs-on: self-hosted
    timeout-minutes: 55

    # Applies to every step, so `actions/checkout` gets the same treatment as
    # the push at the end. Both talk to github.com over HTTPS; both broke on
    # 2026-08-24, when the connection to GitHub dropped on and off all day.
    env:
      # Abort any HTTP transfer that stalls below 1 KB/s for 30 seconds. A dead
      # TCP connection to GitHub otherwise just sits there: one push on
      # 2026-08-24 hung for 56 minutes before giving up, eating the whole
      # timeout for a failure that was obvious in the first half-minute.
      GIT_HTTP_LOW_SPEED_LIMIT: "1000"
      GIT_HTTP_LOW_SPEED_TIME: "30"

      # There is no terminal on a launchd-managed runner, so never let git
      # decide to ask for a password. It cannot be answered.
      GIT_TERMINAL_PROMPT: "0"

      # And never let git fall back to the macOS keychain either. The Command
      # Line Tools ship a system gitconfig that turns on the osxkeychain
      # credential helper for every repo on the machine. From a background
      # service with no GUI session the helper blocks, then returns -25308
      # (errSecInteractionNotAllowed) — so a brief network blip surfaced as
      # "fatal: could not read Username for 'https://github.com'", which points
      # at the wrong problem entirely. Auth here comes from the Actions token
      # that actions/checkout installs as an HTTP extraheader, and nothing else.
      # (Empty value = reset the helper list; needs git >= 2.31.)
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: credential.helper
      GIT_CONFIG_VALUE_0: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so the commit step can rebase cleanly if needed.
          fetch-depth: 0

      - name: Check prerequisites
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            echo "::error::python3 not found on this runner. Install it, or run: xcode-select --install"
            exit 1
          fi
          python3 --version

          # ffmpeg is NOT a prerequisite: requirements.txt includes
          # imageio-ffmpeg, which ships its own build with libmp3lame, and
          # scripts/audio.py falls back to it automatically. A system ffmpeg is
          # used in preference when one happens to be installed.
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            echo "No system ffmpeg — using the one bundled with imageio-ffmpeg."
          fi

      - name: Install dependencies
        run: |
          # The self-hosted runner keeps its working directory between runs, so
          # this virtualenv is created once and reused — later runs are quick.
          python3 -m venv .venv-runner
          .venv-runner/bin/pip install --quiet --disable-pip-version-check \
            --upgrade -r requirements.txt

      - name: Run pipeline
        id: pipeline
        # A failed episode must not stop the run from committing everything
        # that did succeed. The job is failed explicitly at the end instead.
        continue-on-error: true
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          # Passed through the environment rather than interpolated into the
          # shell, so workflow inputs can never be executed as script.
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          ARGS=""
          if [ -n "$INPUT_LIMIT" ]; then ARGS="$ARGS --limit $INPUT_LIMIT"; fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          .venv-runner/bin/python -m scripts.run $ARGS

      - name: Convert any non-audio episodes
        # Spotify rejects an entire feed if even one episode has a video
        # enclosure. Imported back catalogues can contain one. A no-op unless
        # there is something to fix, and never allowed to block the commit.
        continue-on-error: true
        if: ${{ !cancelled() }}
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: .venv-runner/bin/python -m scripts.rehost --apply

      - name: Bring old episodes up to the current audio settings
        # No-op unless audio.bitrate_kbps / audio.channels changed. Bounded per
        # run, and never allowed to block the commit.
        continue-on-error: true
        if: ${{ !cancelled() }}
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: .venv-runner/bin/python -m scripts.reencode --apply

      - name: Validate the feed before committing
        id: validate
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f docs/feed.xml ]; then
            echo "docs/feed.xml was not produced — nothing to validate."
            exit 0
          fi
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          try:
              tree = ET.parse("docs/feed.xml")
          except ET.ParseError as exc:
              sys.exit("docs/feed.xml is not well-formed XML: %s" % exc)
          channel = tree.getroot().find("channel")
          if channel is None:
              sys.exit("docs/feed.xml has no <channel> element")
          print("Feed is well-formed: %d episode(s)." % len(channel.findall("item")))
          PY

      - name: Commit state and feed
        # Runs even when an episode failed — partial progress is still progress.
        # Skipped if validation failed, so a malformed feed is never published;
        # archive.org uploads are idempotent, so the next run resumes safely.
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json docs/feed.xml

          # GitHub disables scheduled workflows after 60 days with no repository
          # activity. A quiet stretch — a summer break, a pause in services —
          # would otherwise silently switch the automation off. Touch a
          # heartbeat file if the last commit is getting old. Costs about eight
          # commits a year and only ever fires during a genuine lull.
          LAST_COMMIT=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - LAST_COMMIT )) -gt 3888000 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-heartbeat
            git add .github/last-heartbeat
            echo "Heartbeat written — keeping the schedule alive."
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(podcast): publish new sermon episodes [skip ci]"
          # Retry with a real backoff: 30s, then 90s, then 270s. The old loop
          # slept 5s between tries and so gave up 16 seconds in — useless
          # against the multi-minute GitHub outages seen on 2026-08-24. This
          # rides out about 6.5 minutes, well inside the 55-minute timeout.
          #
          # Sleep before rebasing, not after: if the push failed because the
          # network is down, the pull would fail for the same reason.
          ATTEMPTS=4
          attempt=1
          delay=30
          while :; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -ge "$ATTEMPTS" ]; then
              break
            fi
            echo "Push failed (attempt $attempt of $ATTEMPTS). Retrying in ${delay}s..."
            sleep "$delay"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            attempt=$((attempt + 1))
            delay=$((delay * 3))
          done
          echo "::error::Could not push the updated state after $ATTEMPTS attempts."
          echo "::error::If the log shows connection resets or stalled transfers,"
          echo "::error::this is a network problem, not a repo problem — the work"
          echo "::error::is idempotent and the next run will redo it."
          exit 1

      - name: Fail the job if any episode failed
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "::error::One or more episodes failed. They stay queued and will"
          echo "::error::be retried on the next run. See the pipeline step log."
          exit 1
